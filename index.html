<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Va urma...</title>
  <!-- Securitate: Content Security Policy (variantă strictă pentru site static) -->
  <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:;
               script-src 'self'; style-src 'self';
               object-src 'none'; base-uri 'self';
               frame-ancestors 'none'; form-action 'self';
               connect-src 'self'; upgrade-insecure-requests">
<!-- Trimite doar ce trebuie în Referer -->
  <meta name="referrer" content="strict-origin-when-cross-origin">


  <!-- SEO -->
  <link rel="canonical" href="https://www.testez.space/">
  <meta name="description" content="Pagină de test pentru verificarea deploy-ului și a mecanismelor de cache." />

  <!-- Anti-cache hint pentru HTML (browser-side) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- CSS versionat (schimbă sufixul când publici o versiune nouă) -->
  <link rel="stylesheet" href="css/styles.2025-11-09-2.css">
</head>
<body>
  <div class="page">
    <div class="card" role="main" aria-labelledby="title">
      <h1 id="title">Andrei Bujor dev.</h1>
      <p>Testare site funcțional.</p>
      <p class="version">
        Build <span id="build"></span> • <span id="now"></span>
      </p>
    </div>
  </div>

  <noscript>
    <div class="noscript">JavaScript este dezactivat. Unele funcții (ex. „bust cache”) nu vor funcționa.</div>
  </noscript>

  <!-- JS versionat -->
  <script src="assets/js/main.2025-11-09-2.js" defer></script>
</body>
</html>
