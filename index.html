<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Message</title>

  <!-- SEO -->
  <link rel="canonical" href="https://www.testez.space/">
  <meta name="description" content="Pagină de test pentru verificarea deploy-ului și a mecanismelor de cache." />

  <!-- Anti-cache hint pentru HTML (browser-side) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- CSS versionat (schimbă sufixul când publici o versiune nouă) -->
  <link rel="stylesheet" href="css/styles.2025-11-09.css">
</head>
<body>
  <div class="page">
    <div class="card" role="main" aria-labelledby="title">
      <h1 id="title">Test</h1>
      <p>Testare site funcțional.</p>

      <div class="actions">
        <button id="refresh" class="btn" type="button" aria-label="Reîncarcă pagina și ocolește cache-ul">
          Reîncarcă (bust cache)
        </button>
      </div>

      <p class="version">
        Build <span id="build"></span> • <span id="now"></span>
      </p>
    </div>
  </div>

  <noscript>
    <div class="noscript">JavaScript este dezactivat. Unele funcții (ex. „bust cache”) nu vor funcționa.</div>
  </noscript>

  <!-- JS versionat -->
  <script src="assets/js/main.2025-11-09.js" defer></script>
</body>
</html>
